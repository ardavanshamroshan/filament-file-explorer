name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - filament: '^4.0'
            livewire: '^3.0'
            laravel: '^11.0'
            testbench: '^9.0'
            php: '8.2'
          - filament: '^5.0'
            livewire: '^4.0'
            laravel: '^12.0'
            testbench: '^10.0'
            php: '8.3'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            filament/filament:${{ matrix.filament }} \
            livewire/livewire:${{ matrix.livewire }} \
            illuminate/contracts:${{ matrix.laravel }} \
            illuminate/database:${{ matrix.laravel }} \
            illuminate/support:${{ matrix.laravel }} \
            orchestra/testbench:${{ matrix.testbench }} \
            --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest
